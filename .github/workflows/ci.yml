name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the web UI
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build the server
        run: go build -o /dev/null ./cmd/ctm
      - name: Check the install scripts
        run: shellcheck proxmox/*.sh
